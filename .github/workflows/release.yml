name: Release

# Every push to main that touches the app becomes a new release. The version is
# package.json's major.minor plus the number of releases already made for it
# (v0.2.0, v0.2.1, ...), so only a new minor needs a bump in package.json.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - '**.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          n=$(gh release list --limit 1000 --json tagName -q "[.[] | select(.tagName | startswith(\"v$base.\"))] | length")
          version="$base.$n"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          # Unset secrets that aren't configured: electron-builder reads an empty
          # CSC_LINK as a path, and an empty APPLE_ID as a notarization request.
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npm run build
          npx electron-builder --mac --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Publish release
        run: |
          (cd dist && shasum -a 256 PixelBot-arm64.dmg > PixelBot-arm64.dmg.sha256)
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/PixelBot-arm64.dmg dist/PixelBot-arm64.dmg.sha256 dist/*.zip dist/*.blockmap dist/latest-mac.yml \
            --target "$GITHUB_SHA" --title "PixelBot ${{ steps.version.outputs.version }}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
